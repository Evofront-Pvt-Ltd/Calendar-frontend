name: Calendar Frontend CI/CD
on:
  push:
    branches: [develop]
    paths: &paths ["app/**", "components/**", "lib/**", "public/**", "types/**", "package.json", "package-lock.json", "tsconfig.json", "next.config.ts", "next-env.d.ts", "Dockerfile", ".dockerignore", "ci-cd/**", "k8s/**", ".github/workflows/calendar-frontend-ci-cd.yml"]
  pull_request:
    branches: [develop]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calendar-frontend-${{ github.ref }}
  cancel-in-progress: false
env:
  NODE_VERSION: "22"
  IMAGE_NAME: calendar-frontend
  FRONTEND_URL: https://calendar.212.2.249.45.nip.io
  NEXT_PUBLIC_API_URL: https://calendar-api.212.2.249.45.nip.io
  NEXT_PUBLIC_ORGANIZATION_EMAIL_DOMAIN: evofront.com
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: bash ci-cd/scripts/ci.sh
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_SHA: ${{ github.sha }}
      KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - run: bash ci-cd/scripts/publish.sh
  urls:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print deployment URLs
        run: |
          INGRESS_IP="$(printf '%s\n' "${FRONTEND_URL#https://}" | sed -E 's/^[^.]+\.([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)\.nip\.io.*/\1/')"
          echo "========================================"
          echo "DEPLOYMENT COMPLETED"
          echo "========================================"
          echo ""
          echo "Application URL:"
          echo "${FRONTEND_URL}"
          echo ""
          echo "API URL:"
          echo "${NEXT_PUBLIC_API_URL}"
          echo ""
          echo "Ingress IP:"
          echo "${INGRESS_IP}"
          echo ""
          echo "========================================"
