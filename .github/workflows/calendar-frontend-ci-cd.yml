name: Calendar Frontend CI/CD
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar-frontend-${{ github.ref }}
  cancel-in-progress: false
env:
  NODE_VERSION: "22"
  IMAGE_NAME: calendar-frontend
  FRONTEND_URL: https://calendar.212.2.249.45.nip.io
  NEXT_PUBLIC_API_URL: https://calendar-api.212.2.249.45.nip.io
  NEXT_PUBLIC_ORGANIZATION_EMAIL_DOMAIN: evofront.com
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"
jobs:
  ci:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: bash ci-cd/scripts/ci.sh
  deploy:
    needs: ci
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.actor != 'github-actions[bot]')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_SHA: ${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - run: bash ci-cd/scripts/publish.sh
  urls:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print deployment URLs
        run: |
          echo "Application URL: ${FRONTEND_URL}"
          echo "API URL: ${NEXT_PUBLIC_API_URL}"
          echo "Image tag: ${GITHUB_SHA}"
          echo "Argo CD app: calendar-frontend-staging — sync when this SHA commit is visible"
