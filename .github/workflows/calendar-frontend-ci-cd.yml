name: Calendar Frontend CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "types/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "next-env.d.ts"
      - "Dockerfile"
      - ".dockerignore"
      - "ci-cd/**"
      - "k8s/**"
      - ".github/workflows/calendar-frontend-ci-cd.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "types/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "next-env.d.ts"
      - "Dockerfile"
      - ".dockerignore"
      - "ci-cd/**"
      - "k8s/**"
      - ".github/workflows/calendar-frontend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  IMAGE_NAME: calendar-frontend
  FRONTEND_URL: https://calendar.212.2.249.45.nip.io
  NEXT_PUBLIC_API_URL: https://calendar-api.212.2.249.45.nip.io
  NEXT_PUBLIC_ORGANIZATION_EMAIL_DOMAIN: evofront.com
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          echo "node $(node -v)"
          echo "npm $(npm -v)"
          node -e "const v=process.versions.node.split('.')[0]; if (v !== '22') { console.error('Expected Node.js 22 from Dockerfile, got', process.versions.node); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          set -euo pipefail
          if node -p "require('./package.json').scripts.lint || ''" | grep -q .; then
            npm run lint
          else
            echo "No lint script is defined in package.json. Skipping lint."
          fi

      - name: Typecheck
        run: |
          set -euo pipefail
          npx next typegen
          npm run typecheck

      - name: Unit tests
        run: |
          set -euo pipefail
          if node -p "require('./package.json').scripts.test || ''" | grep -q .; then
            npm test
          else
            echo "No test script is defined in package.json. Skipping unit tests."
          fi

      - name: Build application
        run: npm run build

      - name: Build container image
        run: |
          set -euo pipefail
          docker build \
            --build-arg "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
            --build-arg "NEXT_PUBLIC_ORGANIZATION_EMAIL_DOMAIN=${NEXT_PUBLIC_ORGANIZATION_EMAIL_DOMAIN}" \
            --build-arg "NEXT_PUBLIC_LANDING_WIDGET_ID=" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Validate container
        run: |
          set -euo pipefail
          if docker ps -a --format '{{.Names}}' | grep -qx calendar-frontend-validate; then
            docker rm -f calendar-frontend-validate
          fi
          docker run -d --name calendar-frontend-validate -p 127.0.0.1:3000:3000 "${IMAGE_NAME}:${GITHUB_SHA}"
          set +e
          ready=0
          for i in $(seq 1 40); do
            if ! docker ps --format '{{.Names}}' | grep -qx calendar-frontend-validate; then
              echo "::error::Frontend container exited before becoming ready"
              docker logs calendar-frontend-validate || true
              docker inspect calendar-frontend-validate || true
              docker rm -f calendar-frontend-validate || true
              exit 1
            fi
            if curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 3
          done
          set -e
          if [ "$ready" != "1" ]; then
            echo "::error::Frontend container did not serve GET / on port 3000"
            docker logs calendar-frontend-validate || true
            docker inspect calendar-frontend-validate || true
            docker rm -f calendar-frontend-validate || true
            exit 1
          fi
          echo "Frontend container validation passed on GET /"
          docker rm -f calendar-frontend-validate

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_PASSWORD}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD must be configured as repository secrets."
            exit 1
          fi

      - name: Build container image
        run: |
          set -euo pipefail
          docker build \
            --build-arg "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
            --build-arg "NEXT_PUBLIC_ORGANIZATION_EMAIL_DOMAIN=${NEXT_PUBLIC_ORGANIZATION_EMAIL_DOMAIN}" \
            --build-arg "NEXT_PUBLIC_LANDING_WIDGET_ID=" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push immutable image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          REMOTE_TAG="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REMOTE_TAG}"
          docker push "${REMOTE_TAG}"
          docker manifest inspect "${REMOTE_TAG}" >/dev/null
          echo "Pushed ${REMOTE_TAG}"

      - name: Ensure Docker Hub pull secret in cluster
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: bash ci-cd/scripts/ensure_dockerhub_pull_secret.sh calendar-frontend

      - name: Update staging manifest image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          python3 ci-cd/scripts/set_deployment_image.py \
            "${DOCKERHUB_USERNAME}/${IMAGE_NAME}" \
            "${GITHUB_SHA}"

      - name: Commit and push GitOps manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          if git diff --staged --quiet; then
            echo "Manifest image tag already matches ${GITHUB_SHA}"
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          git commit -m "deploy: set frontend image to ${SHORT_SHA}"
          git push
