name: Calendar Frontend CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "types/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "next-env.d.ts"
      - "Dockerfile"
      - ".dockerignore"
      - "k8s/**"
      - ".github/workflows/calendar-frontend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  REGISTRY_HOST: calendar-registry.212.2.249.45.nip.io
  IMAGE_NAME: calendar-frontend
  NAMESPACE: calendar-frontend
  FRONTEND_URL: https://calendar.212.2.249.45.nip.io
  NEXT_PUBLIC_API_URL: https://calendar-api.212.2.249.45.nip.io
  NEXT_PUBLIC_ORGANIZATION_EMAIL_DOMAIN: evofront.com
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          echo "node $(node -v)"
          echo "npm $(npm -v)"
          node -e "const v=process.versions.node.split('.')[0]; if (v !== '22') { console.error('Expected Node.js 22 from Dockerfile, got', process.versions.node); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          set -euo pipefail
          if node -p "require('./package.json').scripts.lint || ''" | grep -q .; then
            npm run lint
          else
            echo "No lint script is defined in package.json. Skipping lint."
          fi

      - name: Typecheck
        run: |
          set -euo pipefail
          npx next typegen
          npm run typecheck

      - name: Unit tests
        run: |
          set -euo pipefail
          if node -p "require('./package.json').scripts.test || ''" | grep -q .; then
            npm test
          else
            echo "No test script is defined in package.json. Skipping unit tests."
          fi

      - name: Build application
        run: npm run build

      - name: Build container image
        run: |
          set -euo pipefail
          docker build \
            --build-arg "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
            --build-arg "NEXT_PUBLIC_ORGANIZATION_EMAIL_DOMAIN=${NEXT_PUBLIC_ORGANIZATION_EMAIL_DOMAIN}" \
            --build-arg "NEXT_PUBLIC_LANDING_WIDGET_ID=" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Validate container
        run: |
          set -euo pipefail
          if docker ps -a --format '{{.Names}}' | grep -qx calendar-frontend-validate; then
            docker rm -f calendar-frontend-validate
          fi
          docker run -d --name calendar-frontend-validate -p 127.0.0.1:3000:3000 "${IMAGE_NAME}:${GITHUB_SHA}"
          set +e
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 3
          done
          set -e
          if [ "$ready" != "1" ]; then
            echo "::error::Frontend container did not serve GET / on port 3000"
            docker logs calendar-frontend-validate
            docker rm -f calendar-frontend-validate
            exit 1
          fi
          docker rm -f calendar-frontend-validate
          set +e
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 3
          done
          set -e
          if [ "$ready" != "1" ]; then
            echo "::error::Frontend container did not serve GET / on port 3000"
            docker logs calendar-frontend-validate
            docker rm -f calendar-frontend-validate
            exit 1
          fi
          docker rm -f calendar-frontend-validate

      - name: Authenticate to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push immutable image and record digest
        id: image
        run: |
          set -euo pipefail
          REMOTE_TAG="${REGISTRY_HOST}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REMOTE_TAG}"
          docker push "${REMOTE_TAG}"
          DIGEST_REF="$(docker inspect --format='{{index .RepoDigests 0}}' "${REMOTE_TAG}")"
          if [ -z "${DIGEST_REF}" ]; then
            echo "::error::Could not resolve pushed image digest"
            exit 1
          fi
          echo "digest_ref=${DIGEST_REF}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${DIGEST_REF}"

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG_DATA}" ]; then
            echo "::error::KUBECONFIG secret is required"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          if printf '%s' "${KUBE_CONFIG_DATA}" | grep -qE '^apiVersion:'; then
            printf '%s' "${KUBE_CONFIG_DATA}" > "$HOME/.kube/config"
          else
            printf '%s' "${KUBE_CONFIG_DATA}" | base64 -d > "$HOME/.kube/config"
            if ! grep -qE '^apiVersion:' "$HOME/.kube/config"; then
              echo "::error::KUBECONFIG secret must be raw kubeconfig YAML or base64 kubeconfig YAML"
              exit 1
            fi
          fi
          chmod 600 "$HOME/.kube/config"
          export KUBECONFIG="$HOME/.kube/config"
          kubectl config current-context >/dev/null
          kubectl cluster-info >/dev/null

      - name: Deploy to Kubernetes
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          DIGEST_REF="${{ steps.image.outputs.digest_ref }}"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/rbac.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl -n "${NAMESPACE}" create secret docker-registry calendar-registry-pull \
            --docker-server="${REGISTRY_HOST}" \
            --docker-username="${REGISTRY_USERNAME}" \
            --docker-password="${REGISTRY_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          sed "s|image: REGISTRY_IMAGE_REF|image: ${DIGEST_REF}|" k8s/deployment.yaml | kubectl apply -f -

      - name: Wait for rollout
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          if ! kubectl -n "${NAMESPACE}" rollout status deployment/calendar-frontend --timeout=300s; then
            echo "::error::Frontend rollout failed"
            kubectl -n "${NAMESPACE}" get deploy,rs,pods,svc,ingress -o wide
            kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp | tail -n 80
            kubectl -n "${NAMESPACE}" logs -l app=calendar-frontend --tail=150
            exit 1
          fi
          READY="$(kubectl -n "${NAMESPACE}" get deploy calendar-frontend -o jsonpath='{.status.readyReplicas}')"
          DESIRED="$(kubectl -n "${NAMESPACE}" get deploy calendar-frontend -o jsonpath='{.spec.replicas}')"
          if [ "${READY}" != "${DESIRED}" ]; then
            echo "::error::Ready replica count ${READY} does not match desired ${DESIRED}"
            exit 1
          fi

      - name: Verify HTTPS endpoint
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          kubectl -n "${NAMESPACE}" get ingress calendar-frontend
          set +e
          ok=0
          code="000"
          for i in $(seq 1 36); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${FRONTEND_URL}/")"
            if [ "${code}" = "200" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          set -e
          if [ "${ok}" != "1" ]; then
            echo "::error::HTTPS GET ${FRONTEND_URL}/ did not return 200 (last=${code})"
            kubectl -n "${NAMESPACE}" get ingress,secret,pods -o wide
            exit 1
          fi
          echo "Frontend HTTPS check passed: ${FRONTEND_URL}/ -> 200"
