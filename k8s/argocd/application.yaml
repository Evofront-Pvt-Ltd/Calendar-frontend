apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calendar-frontend-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-frontend
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Evofront-Pvt-Ltd/Calendar-frontend.git
    targetRevision: develop
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: calendar-frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: calendar-frontend
      jsonPointers:
        - /spec/replicas
        - /spec/template/spec/containers/0/image
