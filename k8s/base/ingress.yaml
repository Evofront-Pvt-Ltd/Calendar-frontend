apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calendar-frontend
  namespace: calendar-frontend
  labels:
    app: calendar-frontend
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-frontend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - calendar.212.2.249.45.nip.io
      secretName: calendar-frontend-tls
  rules:
    - host: calendar.212.2.249.45.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calendar-frontend
                port:
                  number: 80
