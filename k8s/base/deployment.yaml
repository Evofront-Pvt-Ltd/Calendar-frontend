apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-frontend
  namespace: calendar-frontend
  labels:
    app: calendar-frontend
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: calendar-frontend
  template:
    metadata:
      labels:
        app: calendar-frontend
        app.kubernetes.io/part-of: calendar
        app.kubernetes.io/name: calendar-frontend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dockerhub-pull
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: calendar-frontend
          image: calendar-frontend:placeholder
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: calendar-frontend-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 80m
              memory: 128Mi
